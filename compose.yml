services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: mbm_motors
      POSTGRES_USER: mbm
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD locally}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbm -d mbm_motors"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
