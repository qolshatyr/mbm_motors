<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">MBM Motors</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/catalog.css}">
</head>
<body>
<header class="site-header" th:fragment="header">
  <a class="skip-link" href="#main">Перейти к содержимому</a>
  <div class="container header-inner">
    <a class="brand" th:href="@{/catalog}" aria-label="MBM Motors — каталог запчастей"><span class="brand-mark" aria-hidden="true">M</span><span>MBM <strong>Motors</strong></span></a>
    <nav aria-label="Основная навигация"><a class="header-cart" th:href="@{/cart}" th:text="|Корзина (${cartCount ?: 0})|">Корзина (0)</a></nav>
  </div>
</header>
<div class="sync-note" th:fragment="sync(lastSyncText, stale)" th:classappend="${stale} ? ' sync-stale' : ''">
  <span class="sync-dot" aria-hidden="true"></span>
  <span th:if="${lastSyncText != null}" th:text="|Данные обновлены: ${lastSyncText}|">Данные обновлены</span>
  <span th:if="${lastSyncText == null}">Каталог ещё не обновлялся</span>
  <span th:if="${stale}" class="sync-warning">Данные могут быть устаревшими. Уточните цену и наличие перед покупкой.</span>
</div>
<footer class="site-footer" th:fragment="footer">
  <div class="container footer-inner"><span>MBM Motors</span><span>Цены в тенге. Наличие указано по данным магазинов.</span></div>
</footer>
</body>
</html>
