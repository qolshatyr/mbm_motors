spring:
  application:
    name: mbm-motors
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mbm_motors}
    username: ${DB_USER:mbm}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 100
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
management:
  # Only /actuator/health is published, as UP or DOWN without details, for an external uptime
  # monitor. It checks the database; catalog freshness is reported to staff by alerts instead.
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      # No Kubernetes here: without probe groups the answer is just {"status":"UP"}.
      probes:
        enabled: false
server:
  address: 127.0.0.1
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
cloudshop:
  base-url: https://connect-api.cloudshop.ru/api/v4
  token: ${CLOUDSHOP_TOKEN:}
  timeout: 30s
catalog:
  sync:
    enabled: false
    interval: 5m
    overlap: 5m
    full-interval: 24h
    page-size: 1000
    max-pages: 100
    request-delay: 1s
    startup-mode: NONE
checkout:
  # Partner orders are picked up at СКЛАД, the only place the portal sells from.
  pickup-store-ids: [6967a39f62918c7e760f3747]
delivery:
  # Sends partner orders to CloudShop as unposted sales. Requires CLOUDSHOP_TOKEN with write access.
  enabled: ${MBM_DELIVERY_ENABLED:false}
  interval: 30s
  stale-after: 5m
alerts:
  # Telegram messages to staff about new orders, UNKNOWN deliveries and orders stuck before delivery.
  # Off while the bot token is empty. See docs/Deployment.md.
  telegram:
    bot-token: ${MBM_ALERT_TELEGRAM_BOT_TOKEN:}
    chat-id: ${MBM_ALERT_TELEGRAM_CHAT_ID:}
  site-url: ${MBM_SITE_URL:}
  interval: 1m
  waiting-after: 15m
  new-orders: ${MBM_ALERT_NEW_ORDERS:true}
  # With catalog sync on: tell staff when no sync has succeeded for this long, and when it recovers.
  sync-stale-after: 30m
admin:
  enabled: ${MBM_ADMIN_ENABLED:false}
  username: ${MBM_ADMIN_USERNAME:}
  password-hash: ${MBM_ADMIN_PASSWORD_HASH:}
  # New clients get a CloudShop customer card right away. Requires CLOUDSHOP_TOKEN with write access.
  create-customers: ${MBM_ADMIN_CREATE_CUSTOMERS:false}
