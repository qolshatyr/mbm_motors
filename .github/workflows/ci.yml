name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Java (verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: mbm_test
          POSTGRES_USER: mbm
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mbm -d mbm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Отдельная тестовая база CI; тесты Testcontainers используют Docker раннера.
      MBM_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/mbm_test
      MBM_TEST_DATABASE_USER: mbm
      MBM_TEST_DATABASE_PASSWORD: ci-test-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Spotless, tests, JaCoCo
        run: ./mvnw -B -ntp verify
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check and build
        run: npm run build

  python:
    name: Python tools (unittest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s tests -v
      - name: Postman JSON
        run: |
          for f in postman/assets/*.json; do python3 -m json.tool "$f" > /dev/null; done

  backup:
    name: Backup and restore (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # Same version as `apt install rclone` on the Ubuntu 24.04 server; apt-get update here takes minutes.
      - name: Install rclone
        run: |
          curl -fsSL -o rclone.zip https://downloads.rclone.org/v1.60.1/rclone-v1.60.1-linux-amd64.zip
          unzip -q -j rclone.zip '*/rclone' -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Production compose database, encrypted remote, restore check
        env:
          MBM_BACKUP_E2E: '1'
        run: python3 -m unittest tests.test_backup_e2e -v
