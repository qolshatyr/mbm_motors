openapi: 3.0.3
info:
  title: MBM Motors Catalog API
  version: 1.1.0
  description: Публичное чтение локального каталога. Цены и свежесть определяет сервер. Корзина и оформление не входят в этот контракт.
servers:
  - url: http://localhost:8080
tags:
  - name: Catalog
    description: Локальный каталог PostgreSQL
paths:
  /api/catalog/stores:
    get:
      operationId: listStores
      tags: [Catalog]
      summary: Места хранения, не согласованные точки самовывоза
      responses:
        '200':
          description: Список мест хранения
          content:
            application/json:
              schema:
                type: object
                required: [stores, defaultStoreId]
                properties:
                  stores:
                    type: array
                    items: {$ref: '#/components/schemas/Store'}
                  defaultStoreId: {type: string}
  /api/catalog/products:
    get:
      operationId: listProducts
      tags: [Catalog]
      summary: Поиск товаров по выбранному месту хранения
      parameters:
        - in: query
          name: q
          schema: {type: string, maxLength: 120, default: ''}
        - in: query
          name: store
          description: При отсутствии используется Car City.
          schema: {type: string}
        - in: query
          name: available
          description: Положительный сохранённый остаток, включая устаревшие данные.
          schema: {type: boolean, default: false}
        - in: query
          name: page
          schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}
        - in: query
          name: sort
          schema: {type: string, enum: [name, price, stock], default: name}
        - in: query
          name: section
          description: Раздел из метки CloudShop.
          schema: {type: string, maxLength: 120}
        - in: query
          name: subsection
          description: Подраздел; только вместе с section.
          schema: {type: string, maxLength: 120}
        - in: query
          name: make
          description: Марка автомобиля.
          schema: {type: string, maxLength: 120}
        - in: query
          name: model
          description: Модель; только вместе с make.
          schema: {type: string, maxLength: 120}
        - in: query
          name: brand
          description: Бренд детали; любой из перечисленных.
          explode: true
          schema: {type: array, maxItems: 20, items: {type: string, maxLength: 120}}
      responses:
        '200':
          description: Страница до 24 товаров; stale запрещает считать сохранённые остатки текущими.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogPage'}
        '400':
          description: Неверные параметры
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404':
          description: Страница вне выдачи
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /api/catalog/products/{id}:
    get:
      operationId: productDetail
      tags: [Catalog]
      summary: Карточка товара с предложениями по местам хранения
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
        - in: query
          name: store
          schema: {type: string}
      responses:
        '200':
          description: Серверные цена, наличие и возможность добавления
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Detail'}
        '400':
          description: Неверное место хранения
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404':
          description: Товар отсутствует
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
components:
  schemas:
    Store:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    Product:
      type: object
      required: [id, name, priceText, stockText]
      properties:
        id: {type: string}
        name: {type: string}
        sku: {type: string, nullable: true}
        code: {type: string, nullable: true}
        unit: {type: string, nullable: true}
        priceText: {type: string}
        stockText: {type: string}
        imageUrl: {type: string, nullable: true, format: uri}
        brand: {type: string, nullable: true, description: 'Бренды детали из меток «Бренд …» через запятую'}
    CatalogFilter:
      type: object
      required: [brands]
      properties:
        section: {type: string, nullable: true}
        subsection: {type: string, nullable: true}
        make: {type: string, nullable: true}
        model: {type: string, nullable: true}
        brands: {type: array, items: {type: string}}
    FacetValue:
      type: object
      required: [name, count]
      properties:
        name: {type: string}
        count: {type: integer, format: int64, minimum: 0}
    Facets:
      type: object
      description: Варианты каждого фильтра с числом товаров при остальных выбранных фильтрах. subsections — только при section, models — только при make.
      required: [sections, subsections, makes, models, brands]
      properties:
        sections: {type: array, items: {$ref: '#/components/schemas/FacetValue'}}
        subsections: {type: array, items: {$ref: '#/components/schemas/FacetValue'}}
        makes: {type: array, items: {$ref: '#/components/schemas/FacetValue'}}
        models: {type: array, items: {$ref: '#/components/schemas/FacetValue'}}
        brands: {type: array, items: {$ref: '#/components/schemas/FacetValue'}}
    Classification:
      type: object
      required: [brands, fitment]
      properties:
        section: {type: string, nullable: true}
        subsection: {type: string, nullable: true}
        brands: {type: array, items: {type: string}}
        fitment:
          type: array
          items:
            type: object
            required: [make, models]
            properties:
              make: {type: string}
              models: {type: array, items: {type: string}}
    CatalogPage:
      type: object
      required: [products, query, storeId, storeName, stores, page, totalPages, totalProducts, stale, filter, facets]
      properties:
        products:
          type: array
          maxItems: 24
          items: {$ref: '#/components/schemas/Product'}
        query: {type: string}
        storeId: {type: string}
        storeName: {type: string}
        stores:
          type: array
          items: {$ref: '#/components/schemas/Store'}
        page: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}
        totalProducts: {type: integer, minimum: 0, format: int64}
        lastSyncText: {type: string, nullable: true, description: 'Время по Алматы, dd.MM.yyyy HH:mm'}
        stale: {type: boolean}
        filter: {$ref: '#/components/schemas/CatalogFilter'}
        facets: {$ref: '#/components/schemas/Facets'}
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
    Detail:
      type: object
      required: [product, offers, selectedStore, stale, classification]
      properties:
        product: {$ref: '#/components/schemas/Product'}
        offers:
          type: array
          items: {$ref: '#/components/schemas/Offer'}
        selectedStore: {type: string}
        lastSyncText: {type: string, nullable: true}
        stale: {type: boolean}
        classification: {$ref: '#/components/schemas/Classification'}
    Offer:
      type: object
      required: [storeId, storeName, priceText, stockText, canAdd, unavailabilityReason]
      properties:
        storeId: {type: string}
        storeName: {type: string}
        priceText: {type: string}
        stockText: {type: string}
        canAdd: {type: boolean}
        unavailabilityReason: {type: string, nullable: true, description: Причина блокировки добавления; null если canAdd=true}
