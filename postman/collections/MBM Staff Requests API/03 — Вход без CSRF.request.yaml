$kind: http-request
name: '03 — Вход без CSRF'
order: 3000
method: POST
url: '{{baseUrl}}/admin/login'
settings:
  followRedirects: false
headers:
  - key: Accept
    value: application/json
  - key: Cookie
    value: '{{sessionCookie}}'
  - key: Content-Type
    value: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    - key: username
      value: '{{staffUsername}}'
    - key: password
      value: '{{staffPassword}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('CSRF обязателен',()=>pm.response.to.have.status(403));
