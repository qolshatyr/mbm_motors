$kind: http-request
name: '06 — Снимок заявки'
order: 6000
method: GET
url: '{{baseUrl}}/admin/api/requests/{{requestNumber}}'
settings:
  followRedirects: false
headers:
  - key: Accept
    value: application/json
  - key: Cookie
    value: '{{sessionCookie}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Снимок доступен',()=>pm.response.to.have.status(200));const b=pm.response.json();pm.test('Контакты и состав, без внутренних ключей',()=>{pm.expect(b.delivery.state).to.be.oneOf(['WAITING_CONFIGURATION','NOT_PREPARED']);pm.expect(b.delivery.message).to.be.a('string').and.not.empty;pm.expect(b.phone).to.be.a('string');pm.expect(b.customerName).to.be.a('string');pm.expect(b.items).to.be.an('array').and.not.empty;pm.expect(b.items[0].priceText).to.be.a('string');for(const key of ['ownerId','idempotencyKey','requestHash','revision'])pm.expect(b).not.to.have.property(key);});
