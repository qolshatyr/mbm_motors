$kind: http-request
name: '10 — Выход без CSRF'
order: 10000
method: POST
url: '{{baseUrl}}/admin/logout'
settings:
  followRedirects: false
headers:
  - key: Accept
    value: application/json
  - key: Cookie
    value: '{{sessionCookie}}'
  - key: Content-Type
    value: application/x-www-form-urlencoded
body:
  type: urlencoded
  content: []
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Выход защищён CSRF',()=>pm.response.to.have.status(403));
