$kind: http-request
name: '05 — Список заявок'
order: 5000
method: GET
url: '{{baseUrl}}/admin/api/requests?page=0'
settings:
  followRedirects: false
headers:
  - key: Accept
    value: application/json
  - key: Cookie
    value: '{{sessionCookie}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Список доступен',()=>pm.response.to.have.status(200));const b=pm.response.json();pm.test('Контракт и приватность списка',()=>{pm.expect(b.pageSize).to.equal(20);pm.expect(b.items).to.be.an('array');pm.expect(b.totalItems).to.be.a('number');for(const row of b.items){pm.expect(row.number).to.be.a('string');pm.expect(row.status).to.equal('RECEIVED');for(const key of ['phone','customerName','comment','ownerId','idempotencyKey','requestHash'])pm.expect(row).not.to.have.property(key);}});pm.test('Данные не кешируются',()=>pm.expect(pm.response.headers.get('Cache-Control')).to.include('no-store'));pm.test('Есть синтетическая заявка',()=>pm.expect(b.items.length).above(0));if(b.items.length)pm.collectionVariables.set('requestNumber',b.items[0].number);
