$kind: http-request
name: 08 — CSRF обязателен
order: 8000
url: '{{baseUrl}}/api/cart/clear'
method: POST
headers:
- key: Content-Type
  value: application/x-www-form-urlencoded
- key: Accept
  value: application/json
- key: Cookie
  value: '{{sessionCookie}}'
  description: Cookie собственной сессии из шага 01; явный заголовок для локального
    CLI.
body:
  type: urlencoded
  content: []
scripts:
- type: afterResponse
  language: text/javascript
  code: |
    pm.test('HTTP 403', () => pm.response.to.have.status(403));
    pm.test('ProblemDetail CSRF', () => pm.expect(pm.response.json().status).to.equal(403));
