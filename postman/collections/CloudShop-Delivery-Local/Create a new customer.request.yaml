$kind: http-request
name: 01 — Синтетический покупатель
order: 1000
method: POST
url: http://127.0.0.1:4900/api/v4/customers
headers:
- key: Content-Type
  value: application/json
- key: X-CloudShop-API-Access-Token
  value: synthetic-local-only
body:
  type: json
  content: '{"type": "person", "name": "Synthetic Buyer", "phones": ["+77000000000"]}'
settings:
  followRedirects: false
scripts:
- type: beforeRequest
  language: text/javascript
  code: const u=pm.variables.replaceIn(pm.request.url.toString()); if (!u.startsWith('http://127.0.0.1:4900/'))
    { pm.execution.skipRequest(); throw new Error('Synthetic localhost fixture only');
    }
- type: afterResponse
  language: text/javascript
  code: pm.test('Customer created', () => pm.response.to.have.status(201)); pm.test('Valid
    customer id', () => pm.expect(pm.response.json().id).to.match(/^[a-f0-9]{24}$/));
    pm.collectionVariables.set('customerId', pm.response.json().id);
