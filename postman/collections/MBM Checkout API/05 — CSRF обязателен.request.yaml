$kind: http-request
name: 05 — CSRF обязателен
order: 5000
url: '{{baseUrl}}/api/orders'
method: POST
headers:
- key: Accept
  value: application/json
- key: Cookie
  value: '{{sessionCookie}}'
- key: Content-Type
  value: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
  - key: idempotencyKey
    value: '{{key}}'
  - key: revision
    value: '{{revision}}'
  - key: customerName
    value: Проверка
  - key: phone
    value: '+77000000000'
  - key: comment
    value: ''
  - key: consent
    value: 'true'
scripts:
- type: afterResponse
  language: text/javascript
  code: |
    pm.test('HTTP 403',()=>pm.response.to.have.status(403));
    const body=pm.response.json();
    pm.test('Защита',()=>pm.expect(body.status).to.equal(403));
